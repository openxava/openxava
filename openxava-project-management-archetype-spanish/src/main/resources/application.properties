server.servlet.context-path=/tuaplicacion
server.tomcat.additional-tld-skip-patterns=htmlunit-*.jar,jetty-*.jar,c3p0-*.jar,mchange-commons-*.jar

spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000

# Para usar una base de datos diferente, comenta la url y driver-class-name
# de HSQLDB de abajo y descomenta la correspondiente. Si no encuentras la tuya,
# busca en internet la URL JDBC y el driver class para tu base de datos y
# define tus propias entradas.
#
# Has de adaptar la URL a tu propio servidor, y quizás también el puerto.
# Has de definir el usuario y contraseña correctos para tu base de datos arriba.
#
# Además, has de añadir el controlador JDBC (un archivo jar) correspondiente
# a tu base de datos a las dependencias de tu proyecto (pom.xml).

# HSQLDB
spring.datasource.url=jdbc:hsqldb:hsql://localhost:1666
spring.datasource.driver-class-name=org.hsqldb.jdbcDriver

# MySQL
#spring.datasource.url=jdbc:mysql://localhost:3306/
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# PostgreSQL
#spring.datasource.url=jdbc:postgresql://localhost/
